<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigitalOcean Customer Support Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            height: 90vh;
        }

        .sidebar {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow-y: auto;
        }

        .main-content {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f0f0f0;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-right: 12px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-left: auto;
        }

        .status-badge.online {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.escalated {
            background: #f8d7da;
            color: #721c24;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 20px 0 12px;
        }

        .conversation-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .conversation-item {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .conversation-item:hover {
            background: #f5f5f5;
        }

        .conversation-item.active {
            background: #f0f4ff;
            border-left-color: #667eea;
        }

        .conversation-item-title {
            font-weight: 600;
            font-size: 13px;
            color: #333;
            margin-bottom: 4px;
        }

        .conversation-item-time {
            font-size: 12px;
            color: #999;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 2px solid #f0f0f0;
            margin-bottom: 16px;
        }

        .chat-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .ticket-info {
            font-size: 13px;
            color: #666;
            display: flex;
            gap: 12px;
        }

        .ticket-badge {
            display: inline-block;
            padding: 2px 8px;
            background: #e8f4f8;
            color: #0066cc;
            border-radius: 4px;
            font-weight: 600;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.customer {
            justify-content: flex-end;
        }

        .message.agent {
            justify-content: flex-start;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: white;
            flex-shrink: 0;
        }

        .message.customer .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .message.agent .message-avatar {
            background: #f0f0f0;
            color: #333;
        }

        .message-content {
            max-width: 70%;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.customer .message-bubble {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.agent .message-bubble {
            background: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        .system-message {
            text-align: center;
            padding: 12px;
            background: #fff3cd;
            border-radius: 8px;
            color: #856404;
            font-size: 13px;
            font-weight: 500;
        }

        .input-area {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-field {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            max-height: 100px;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            outline: none;
            border-color: #667eea;
        }

        .send-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .send-btn:hover {
            transform: translateY(-2px);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            font-size: 13px;
            padding: 8px 12px;
            background: #f9f9f9;
            border-radius: 8px;
        }

        .spinner {
            width: 12px;
            height: 12px;
            border: 2px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .ticket-details {
            margin-top: 16px;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .detail-label {
            color: #666;
            font-weight: 500;
        }

        .detail-value {
            color: #333;
            font-weight: 600;
        }

        .priority-high {
            color: #dc3545;
        }

        .priority-medium {
            color: #fd7e14;
        }

        .priority-low {
            color: #28a745;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
            }

            .message-content {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="header">
                <div class="logo">🎯 Support</div>
                <span class="status-badge online">Online</span>
            </div>

            <div class="section-title">Your Conversations</div>
            <div class="conversation-list" id="conversationList">
                <!-- Populated by JavaScript -->
            </div>

            <div class="section-title" style="margin-top: 32px;">Quick Actions</div>
            <button onclick="startNewConversation()" style="
                width: 100%;
                padding: 10px;
                background: #f0f4ff;
                border: 2px solid #667eea;
                border-radius: 8px;
                color: #667eea;
                font-weight: 600;
                cursor: pointer;
                margin-bottom: 8px;
                transition: all 0.2s;
            " onmouseover="this.style.background='#667eea'; this.style.color='white'" onmouseout="this.style.background='#f0f4ff'; this.style.color='#667eea'">
                + New Conversation
            </button>
        </div>

        <!-- Main Chat Area -->
        <div class="main-content">
            <div id="noConversation" style="text-align: center; color: #999; padding: 40px 20px;">
                <div style="font-size: 48px; margin-bottom: 16px;">👋</div>
                <div style="font-size: 16px;">No conversation selected</div>
                <div style="font-size: 13px; margin-top: 8px;">Start a new conversation or select one from the list</div>
            </div>

            <div id="chatView" style="display: none; height: 100%; display: flex; flex-direction: column;">
                <div class="chat-header">
                    <div>
                        <div class="chat-title" id="chatTitle">Loading...</div>
                        <div class="ticket-info" id="ticketInfo"></div>
                    </div>
                    <div id="escalationBadge"></div>
                </div>

                <div class="messages" id="messages"></div>

                <div id="loadingIndicator" class="loading-indicator" style="display: none;">
                    <div class="spinner"></div>
                    <span>Agent is typing...</span>
                </div>

                <div id="ticketDetails"></div>

                <div class="input-area">
                    <textarea class="input-field" id="messageInput" placeholder="Type your message..." rows="2"></textarea>
                    <button class="send-btn" onclick="sendMessage()" id="sendBtn">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api/v1';
        let currentSessionId = null;
        let currentCustomerId = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadConversations();
            document.getElementById('messageInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        });

        async function loadConversations() {
            try {
                const response = await fetch(`${API_BASE}/conversations`);
                const data = await response.json();

                const list = document.getElementById('conversationList');
                list.innerHTML = '';

                if (data.conversations && data.conversations.length > 0) {
                    data.conversations.forEach(conv => {
                        const item = document.createElement('div');
                        item.className = 'conversation-item';
                        item.innerHTML = `
                            <div class="conversation-item-title">${conv.subject || 'Conversation #' + conv.session_id.slice(-6)}</div>
                            <div class="conversation-item-time">${new Date(conv.updated_at).toLocaleDateString()}</div>
                        `;
                        item.onclick = () => loadConversation(conv.session_id, conv.customer_id);
                        list.appendChild(item);
                    });
                } else {
                    list.innerHTML = '<p style="color: #999; text-align: center; padding: 20px;">No conversations yet</p>';
                }
            } catch (error) {
                console.error('Error loading conversations:', error);
            }
        }

        async function loadConversation(sessionId, customerId) {
            currentSessionId = sessionId;
            currentCustomerId = customerId;

            // Update UI
            document.getElementById('noConversation').style.display = 'none';
            document.getElementById('chatView').style.display = 'flex';

            // Update sidebar selection
            document.querySelectorAll('.conversation-item').forEach(item => {
                item.classList.remove('active');
            });
            event.target.closest('.conversation-item').classList.add('active');

            // Load messages
            try {
                const response = await fetch(`${API_BASE}/conversations/${sessionId}/messages`);
                const data = await response.json();

                document.getElementById('chatTitle').textContent = 'Conversation #' + sessionId.slice(-6);
                renderMessages(data.messages);
                loadTicketInfo(sessionId);
            } catch (error) {
                console.error('Error loading conversation:', error);
            }
        }

        function renderMessages(messages) {
            const container = document.getElementById('messages');
            container.innerHTML = '';

            messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.role}`;

                const time = new Date(msg.created_at).toLocaleTimeString();
                const avatar = msg.role === 'customer' ? '👤' : '🤖';

                div.innerHTML = `
                    <div class="message-avatar">${avatar}</div>
                    <div class="message-content">
                        <div class="message-bubble">${escapeHtml(msg.message)}</div>
                        <div class="message-time">${time}</div>
                    </div>
                `;
                container.appendChild(div);
            });

            // Scroll to bottom
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message || !currentSessionId) return;

            // Add user message to UI
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message customer';
            div.innerHTML = `
                <div class="message-avatar">👤</div>
                <div class="message-content">
                    <div class="message-bubble">${escapeHtml(message)}</div>
                    <div class="message-time">${new Date().toLocaleTimeString()}</div>
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;

            input.value = '';
            input.style.height = 'auto';

            // Show loading indicator
            document.getElementById('loadingIndicator').style.display = 'flex';
            document.getElementById('sendBtn').disabled = true;

            try {
                const response = await fetch(`${API_BASE}/conversations/${currentSessionId}/message`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        customer_id: currentCustomerId,
                        message: message
                    })
                });

                const data = await response.json();

                // Add agent response
                const agentDiv = document.createElement('div');
                agentDiv.className = 'message agent';
                agentDiv.innerHTML = `
                    <div class="message-avatar">🤖</div>
                    <div class="message-content">
                        <div class="message-bubble">${escapeHtml(data.response)}</div>
                        <div class="message-time">${new Date().toLocaleTimeString()}</div>
                    </div>
                `;
                container.appendChild(agentDiv);

                // Check if escalated
                if (data.escalated) {
                    const systemDiv = document.createElement('div');
                    systemDiv.className = 'system-message';
                    systemDiv.textContent = `✓ Escalated to human agent. Reference: ${data.reference_id}`;
                    container.appendChild(systemDiv);
                }

                container.scrollTop = container.scrollHeight;
                loadConversations(); // Refresh list
                loadTicketInfo(currentSessionId);
            } catch (error) {
                console.error('Error sending message:', error);
                const errorDiv = document.createElement('div');
                errorDiv.className = 'system-message';
                errorDiv.style.background = '#f8d7da';
                errorDiv.style.color = '#721c24';
                errorDiv.textContent = 'Error: Failed to send message';
                container.appendChild(errorDiv);
            } finally {
                document.getElementById('loadingIndicator').style.display = 'none';
                document.getElementById('sendBtn').disabled = false;
            }
        }

        async function loadTicketInfo(sessionId) {
            try {
                const response = await fetch(`${API_BASE}/conversations/${sessionId}/ticket`);
                const data = response.json();

                const ticketInfo = document.getElementById('ticketInfo');
                const ticketDetails = document.getElementById('ticketDetails');

                if (data && data.ticket) {
                    const ticket = data.ticket;
                    ticketInfo.innerHTML = `
                        <span class="ticket-badge">Ticket ${ticket.ticket_number}</span>
                        <span>${ticket.category}</span>
                    `;

                    ticketDetails.innerHTML = `
                        <div class="ticket-details">
                            <div class="detail-row">
                                <span class="detail-label">Status:</span>
                                <span class="detail-value">${ticket.status}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Priority:</span>
                                <span class="detail-value priority-${ticket.priority}">${ticket.priority.toUpperCase()}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Category:</span>
                                <span class="detail-value">${ticket.category}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Assigned To:</span>
                                <span class="detail-value">${ticket.assigned_to || 'Unassigned'}</span>
                            </div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading ticket:', error);
            }
        }

        function startNewConversation() {
            currentSessionId = null;
            currentCustomerId = 'cust_' + Math.random().toString(36).substr(2, 9);

            document.getElementById('noConversation').style.display = 'block';
            document.getElementById('chatView').style.display = 'none';
            document.querySelectorAll('.conversation-item').forEach(item => {
                item.classList.remove('active');
            });

            loadConversations();
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
