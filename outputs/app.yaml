name: mars-customer-support-agent
services:
- name: support-agent-api
  github:
    repo: your-org/mars-customer-support-demo
    branch: main
    build_command: pip install -r requirements.txt
  http_port: 5000
  envs:
  - key: OPENAI_API_KEY
    scope: RUN_AND_BUILD_TIME
    value: ${OPENAI_API_KEY}
  - key: DB_HOST
    scope: RUN_TIME
    value: ${db.HOSTNAME}
  - key: DB_PORT
    scope: RUN_TIME
    value: "5432"
  - key: DB_NAME
    scope: RUN_TIME
    value: support_db
  - key: DB_USER
    scope: RUN_TIME
    value: postgres
  - key: DB_PASSWORD
    scope: RUN_TIME
    value: ${db.PASSWORD}
  health_check:
    http_path: /health
  http_request_count: 10
  instance_count: 2
  instance_size_slug: basic-xs

databases:
- name: db
  engine: PG
  version: "15"
  production: true
