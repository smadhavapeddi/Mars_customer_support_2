version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mars-portal-db
    environment:
      POSTGRES_DB: support_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema_portal.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mars-network

  node-api:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: mars-portal-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: support_db
      DB_USER: postgres
      DB_PASSWORD: postgres_password_dev
      PORT: 3000
      NODE_ENV: development
      MODEL_ACCESS_KEY: ${MODEL_ACCESS_KEY}
      SERVERLESS_INFERENCE_URL: https://inference.do-ai.run
      INFERENCE_MODEL: claude-3-5-sonnet-20241022
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - mars-network
    command: npm start

  python-agent:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: mars-portal-agent
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: support_db
      DB_USER: postgres
      DB_PASSWORD: postgres_password_dev
      MODEL_ACCESS_KEY: ${MODEL_ACCESS_KEY}
      SERVERLESS_INFERENCE_URL: https://inference.do-ai.run
      INFERENCE_MODEL: claude-3-5-sonnet-20241022
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - mars-network
    command: echo "Python agent services ready"

volumes:
  postgres_data:
    driver: local

networks:
  mars-network:
    driver: bridge
